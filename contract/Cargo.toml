[package]
name = "bound-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
bound-policy = { path = "../policy" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["legacy", "unit-testing"] }
# near-parameters is already in the lock file as a near-sdk dependency. The
# unit tests rebuild the mocked chain with it.
near-parameters = "0.38.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
