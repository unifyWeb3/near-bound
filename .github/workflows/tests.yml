name: tests

on:
  push:
    branches: [master, 'fix/**']
  pull_request:

jobs:
  policy:
    name: policy engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        working-directory: policy
        run: cargo test --locked
      - name: fmt
        working-directory: policy
        run: cargo fmt --check
      - name: clippy
        working-directory: policy
        run: cargo clippy --all-targets --locked -- -D warnings

  contract:
    name: contract
    runs-on: ubuntu-latest
    env:
      # The wasm carries the paths of the crates it was built from, so the
      # build only gives the same bytes on every machine if the cargo home is
      # in the same place. The README has the same recipe.
      CARGO_HOME: /tmp/bound-cargo
      # The wasm carries the paths of the crates it was built from. These two
      # rewrites take the machine out of the bytes, so the artifact is the
      # same everywhere.
      RUSTFLAGS: >-
        --remap-path-prefix=/home/runner/work/near-bound/near-bound=repo
        --remap-path-prefix=/tmp/bound-cargo/registry/src/index.crates.io-1949cf8c6b5b557f=registry
    steps:
      - uses: actions/checkout@v4
      # The rust version is pinned so the wasm this workflow builds is the
      # same wasm that is on chain. The build has to be byte identical for
      # the code hash to match.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: test
        working-directory: contract
        run: cargo test --locked
      - name: fmt
        working-directory: contract
        run: cargo fmt --check
      - name: clippy
        working-directory: contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build the wasm
        working-directory: contract
        run: cargo build --release --locked --target wasm32-unknown-unknown
      - name: get wasm-opt
        run: |
          curl -sL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  binaryen.tar.gz" | sha256sum -c -
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: optimise the wasm
        working-directory: contract
        run: |
          wasm-opt -Oz --enable-nontrapping-float-to-int --enable-bulk-memory \
            target/wasm32-unknown-unknown/release/bound_contract.wasm -o bound_contract.wasm
          sha256sum bound_contract.wasm
      - name: the wasm
        uses: actions/upload-artifact@v4
        with:
          name: bound_contract.wasm
          path: contract/bound_contract.wasm
