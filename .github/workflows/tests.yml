name: tests

on:
  push:
    branches: [master, 'fix/**']
  pull_request:

permissions:
  contents: read

env:
  # The Rust toolchain is pinned in rust-toolchain.toml (1.99.1). The same
  # toolchain is used for policy and contract so the wasm build is reproducible.
  # scripts/build-wasm.sh owns RUSTFLAGS because its canonical source and
  # registry remaps must be identical on developer machines and in CI.
  CARGO_HOME: /home/runner/.audit-cargo
  CARGO_INCREMENTAL: "0"

jobs:
  policy:
    name: policy engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
      - name: test
        working-directory: policy
        run: cargo test --locked
      - name: fmt
        working-directory: policy
        run: cargo fmt --check
      - name: clippy
        working-directory: policy
        run: cargo clippy --all-targets --locked -- -D warnings

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: test
        working-directory: contract
        run: cargo test --locked
      - name: fmt
        working-directory: contract
        run: cargo fmt --check
      - name: clippy
        working-directory: contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build and optimise the wasm (deterministic double build)
        run: bash scripts/build-wasm.sh
      - name: the wasm matches the committed artifact hash
        run: |
          expected="$(python3 -c 'import json;print(json.load(open("docs/wasm-lock.json"))["sha256"])')"
          actual="$(sha256sum contract/target/wasm32-unknown-unknown/release/bound_contract.wasm | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "wasm hash mismatch: built $actual, committed $expected" >&2
            exit 1
          fi
          echo "wasm sha256 $actual matches docs/wasm-lock.json"
      - name: shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_ARCHIVE: shellcheck-v0.11.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/$SHELLCHECK_ARCHIVE"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$SHELLCHECK_ARCHIVE" \
            -o "$archive"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" --version
          "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" \
            demo/agent.sh \
            demo/nonce.sh \
            demo/protocol_arm.sh \
            scripts/build-wasm.sh \
            scripts/dependency-check.sh \
            tests/fake-near/run.sh \
            tests/dependency-check/run.sh
      - name: dependency vulnerability check
        run: bash scripts/dependency-check.sh
      - name: dependency-check failure-path tests
        run: bash tests/dependency-check/run.sh
      - name: fake-NEAR shell tests
        run: bash tests/fake-near/run.sh
      - name: claims consistency check
        run: python3 scripts/claims.py --check

  web:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install the locked web dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: run the web Node tests
        working-directory: web
        run: npm test
      - name: every module parses
        run: |
          for file in web/*.js web/lib/*.js web/views/*.js web/components/*.js; do
            node --check "$file"
          done
