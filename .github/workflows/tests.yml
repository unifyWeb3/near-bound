name: tests

on:
  push:
    branches: [master, 'fix/**']
  pull_request:

env:
  # The Rust toolchain is pinned in rust-toolchain.toml (1.99.1). The same
  # toolchain is used for policy and contract so the wasm build is reproducible.
  CARGO_HOME: /home/runner/.audit-cargo
  RUSTFLAGS: >-
    --remap-path-prefix=$GITHUB_WORKSPACE=repo
    --remap-path-prefix=$CARGO_HOME/registry/src/index.crates.io-1949cf8c6b5b557f=registry

jobs:
  policy:
    name: policy engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: test
        working-directory: policy
        run: cargo test --locked
      - name: fmt
        working-directory: policy
        run: cargo fmt --check
      - name: clippy
        working-directory: policy
        run: cargo clippy --all-targets --locked -- -D warnings

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: test
        working-directory: contract
        run: cargo test --locked
      - name: fmt
        working-directory: contract
        run: cargo fmt --check
      - name: clippy
        working-directory: contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: build and optimise the wasm (deterministic double build)
        run: bash scripts/build-wasm.sh
      - name: the wasm matches the committed artifact hash
        run: |
          expected="$(python3 -c 'import json;print(json.load(open("docs/wasm-lock.json"))["sha256"])')"
          actual="$(sha256sum contract/target/wasm32-unknown-unknown/release/bound_contract.wasm | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "wasm hash mismatch: built $actual, committed $expected" >&2
            exit 1
          fi
          echo "wasm sha256 $actual matches docs/wasm-lock.json"
      - name: shellcheck
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck demo/agent.sh demo/protocol_arm.sh
      - name: dependency vulnerability check
        run: bash scripts/dependency-check.sh
      - name: fake-NEAR shell tests
        run: bash tests/fake-near/run.sh
      - name: claims consistency check
        run: python3 scripts/claims.py --check

  web:
    name: web tests
    runs-on: ubuntu-latest
    # web/package.json is added by the separate web task. Tolerate its absence
    # until integration, then prefer running the Node test suite.
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: run the web Node tests
        run: cd web && node --test test/*.test.js
      - name: every module parses
        run: |
          for file in web/*.js web/lib/*.js web/views/*.js web/components/*.js; do
            node --check "$file"
          done
